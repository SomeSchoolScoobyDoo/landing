name: Secret scan

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "setup/**"
      - "feature/**"
      - "feat/**"
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan repository for exposed secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan working tree and Git history with Gitleaks
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.24.2
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace
        with:
          args: detect --source . --redact --verbose --exit-code 1
